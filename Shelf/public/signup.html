<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="login.js"></script>
    <link rel="stylesheet" href="./login.css">
    <title>Document</title>
</head>
<body>
    <div class = "login-box">
        <h1 id="page-title">Sign up</h1>
        <form action="">
            <div class="input-box">
                <span class = "icon"><ion-icon name="person-outline"></ion-icon></span>
                <input class="info-inputs" type="text" id="username-input" placeholder="Enter username...">
            </div>

            <div class="input-box">
                
                <span class = "icon"><ion-icon name="shield-checkmark-outline"></ion-icon></span>
                <input class="info-inputs" type="password" id="password-input" placeholder="Enter password...">
                

            </div>

            <div class="input-box">
                <br>
                <input class="info-inputs" type="password" id="confirm-password-input" placeholder="Confirm password...">

            </div>
            <button type="submit" id="submit-button">Submit</button>
            <div class="cancel-container">
                <button type="button" id="cancel">Cancel</button>
            </div>

        </form>
    </div>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script type="module" src="src/login.js"></script>
</body>
</html>
